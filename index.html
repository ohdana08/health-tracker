<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>건강 추적기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background:#0d0d0d;
      color:white;
      font-family:sans-serif;
      margin:0;
      padding:20px;
    }

    .card {
      background:#1a1a1a;
      padding:16px;
      border-radius:12px;
      margin-bottom:12px;
    }

    .check-item {
      padding:10px;
      margin:6px 0;
      border-radius:8px;
      background:#222;
      cursor:pointer;
    }

    .checked {
      background:#4caf50;
    }

    input {
      width:100%;
      padding:8px;
      margin-top:6px;
      border-radius:6px;
      border:none;
    }
  </style>
</head>

<body>

<h2 id="dateDisplay"></h2>

<div class="card" id="dashboard"></div>

<div class="card">
  <h3>체크리스트</h3>
  <div class="check-item" data-key="water" onclick="toggleCheck(this)">물 마시기</div>
  <div class="check-item" data-key="exercise" onclick="toggleCheck(this)">운동</div>
  <div class="check-item" data-key="vitamin" onclick="toggleCheck(this)">영양제</div>
</div>

<div class="card">
  <h3>기록</h3>
  기상시간 <input id="wakeTime" type="time">
  수면시간 <input id="sleepTime" type="time">
</div>

<script>
// 상태
let currentDate = new Date();
let allData = JSON.parse(localStorage.getItem('tracker') || '{}');

function dateKey(d){
  return d.toISOString().split('T')[0];
}

function getDayData(){
  const key = dateKey(currentDate);
  if(!allData[key]) allData[key] = {};
  return allData[key];
}

// 점수
function calculateScore(data){
  let score = 0;

  let done = 0;
  ['water','exercise','vitamin'].forEach(k=>{
    if(data[k]) done++;
  });

  score += done * 20;

  if(data.sleepTime) score += 20;
  if(data.wakeTime) score += 20;

  return Math.min(score,100);
}

// 스트릭
function getStreak(){
  let count = 0;
  let d = new Date();

  while(true){
    const key = dateKey(d);
    if(allData[key]){
      const score = calculateScore(allData[key]);
      if(score >= 60){
        count++;
        d.setDate(d.getDate()-1);
      } else break;
    } else break;
  }

  return count;
}

// 메시지
function getMessage(score){
  if(score >= 90) return "🔥 완벽한 하루입니다";
  if(score >= 70) return "👍 좋은 흐름입니다";
  if(score >= 50) return "🙂 조금만 더!";
  return "💡 하나만 해도 충분합니다";
}

// UI
function updateUI(){
  const data = getDayData();
  const score = calculateScore(data);
  const streak = getStreak();

  document.getElementById('dateDisplay').innerText = dateKey(currentDate);

  document.getElementById('dashboard').innerHTML = `
    <div>점수: ${score}</div>
    <div>🔥 ${streak}일 연속</div>
    <div>${getMessage(score)}</div>
  `;

  document.querySelectorAll('.check-item').forEach(el=>{
    const k = el.dataset.key;
    el.classList.toggle('checked', data[k]);
  });

  document.getElementById('wakeTime').value = data.wakeTime || '';
  document.getElementById('sleepTime').value = data.sleepTime || '';
}

// 저장
function save(){
  const data = getDayData();
  data.wakeTime = document.getElementById('wakeTime').value;
  data.sleepTime = document.getElementById('sleepTime').value;

  localStorage.setItem('tracker', JSON.stringify(allData));
}

// 체크
function toggleCheck(el){
  const data = getDayData();
  const k = el.dataset.key;

  data[k] = !data[k];

  save();
  updateUI();
}

// 입력 이벤트
document.getElementById('wakeTime').addEventListener('change', ()=>{
  save();
  updateUI();
});

document.getElementById('sleepTime').addEventListener('change', ()=>{
  save();
  updateUI();
});

// 초기화
updateUI();

</script>

</body>
</html>
